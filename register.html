<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RentCar Patra</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="frontend/libraries/bootstrap/css/bootstrap.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <!-- Style CSS -->
    <link rel="stylesheet" href="frontend/styles/main.css" />
    <!-- <link rel="stylesheet" href="frontend/styles/register.css" /> -->
    <!-- <link rel="stylesheet" href="frontend/styles/main.scss" /> -->
    <!-- Swipper -->
    <link rel="stylesheet" href="frontend/styles/swiper-bundle.min.css" />
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/swiper@11.1.4/swiper-bundle.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <section class="register">
        <div class="register-container">
            <div class="register-left">
                <!-- Background image will be set via CSS -->
            </div>
            <div class="register-right">
                <div class="logo-container">
                    <a href="index.html"><img src="frontend/images/logo.svg" alt="Logo" class="logo"></a>
                </div>
                <div class="register-header">
                    <h2>New Account</h2>
                    <p>Lengkapi form di bawah dengan <br> menggunakan data Anda yang valid</p>
                </div>
                <div class="register-card">
                    <form class="register-form">
                        <div class="form-group">
                            <p class="form-label">Name</p>
                            <input type="text" class="form-input" placeholder="Enter your full name">
                        </div>
                        <div class="form-group">
                            <p class="form-label">Email Address</p>
                            <input type="email" class="form-input" placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <p class="form-label">Password</p>
                            <input type="password" class="form-input" placeholder="Create a password">
                        </div>
                        <div class="form-group">
                            <p class="form-label">Password</p>
                            <input type="password" class="form-input" placeholder="Confirm a password">
                        </div>
                        <button type="button" class="btn-register" onclick="window.location.href = 'index.html';">Register Now</button>
                        <button type="button" class="btn-register login" onclick="window.location.href = 'index.html';">Login</button>
                        <!-- <button type="button" class="btn-login">Login</button> -->
                    </form>
                </div>
            </div>
        </div>
    </section>



    <script src="frontend/scripts/swiper-bundle.min.jsx"></script>
    <script src="frontend/scripts/main.js"></script>
    <script src="frontend/scripts/auth.js"></script>
    <!-- Bootstrap CSS -->
    <!-- jQuery (optional, if using Bootstrap 5 with native JS, this is not needed) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap JS (including Popper.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.4/swiper-bundle.min.js"></script>
    <script src="frontend/libraries/jquery/jquery-3.7.1.min.js"></script>
    <script src="frontend/libraries/bootstrap/js/bootstrap.js"></script>
    <script src="frontend/libraries/retina/retina.min.js"></script>
</body>

</html>
